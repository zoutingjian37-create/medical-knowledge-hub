<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>公众号批量查找</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    body{background:#f6f8fb;color:#172033;font-family:system-ui,"Microsoft YaHei",sans-serif}
    main{max-width:820px;margin:0 auto;padding:36px 22px 70px}
    .panel{background:#fff;border:1px solid #e6eaf0;border-radius:16px;padding:24px}
    textarea{width:100%;min-height:145px;box-sizing:border-box;padding:14px;border:1px solid #ccd3dd;border-radius:10px;font:inherit;line-height:1.7}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
    button{border:0;border-radius:10px;padding:11px 18px;font:inherit;cursor:pointer;background:#1677ff;color:#fff}
    button.secondary{background:#eef4ff;color:#155eef}
    button:disabled{opacity:.55;cursor:wait}
    .hint{color:#667085;line-height:1.65}
    #result{margin-top:18px;white-space:pre-wrap;background:#f8fafc;border-radius:10px;padding:14px;min-height:28px}
  </style>
</head>
<body>
<main>
  <h1>公众号批量查找</h1>
  <p class="hint">输入公众号名称，系统会在本机微信里查找公开文章。</p>
  <section class="panel">
    <label for="accounts"><strong>公众号名称（每行一个）</strong></label>
    <textarea id="accounts">统计之光医学统计
统计之光公共数据库
医学论文与统计分析</textarea>
    <div class="actions">
      <button class="secondary" id="discover">只查找链接</button>
      <button id="collect">查找并加入待处理</button>
    </div>
    <p class="hint">如果微信界面更新，查找可能失败；失败时会显示原因。程序不会读取 Cookie、Token 或聊天数据库。</p>
    <div id="result" aria-live="polite">等待开始</div>
  </section>
</main>
<script>
  const result = document.getElementById("result");
  const buttons = Array.from(document.querySelectorAll("button"));
  function payload(){
    return {
      accounts: document.getElementById("accounts").value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean),
      per_account: 10
    };
  }
  async function run(path){
    buttons.forEach(button=>button.disabled=true);
    result.textContent="正在操作本机微信，请暂时不要移动鼠标或切换微信窗口……";
    try{
      const response=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload())});
      const data=await response.json();
      if(!response.ok) throw new Error(data.detail || "操作失败");
      if(data.links) result.textContent=data.links.length ? data.links.join("\n") : "没有发现公开文章链接";
      else result.textContent=data.results.map(item=>`${item.status}: ${item.title || item.job_id || item.reason}`).join("\n") || "没有新文章需要提炼";
    }catch(error){ result.textContent="未完成："+error.message; }
    finally{ buttons.forEach(button=>button.disabled=false); }
  }
  document.getElementById("discover").addEventListener("click",()=>run("/api/ext/platforms/wechat/discover"));
  document.getElementById("collect").addEventListener("click",()=>run("/api/ext/platforms/wechat/collect"));
</script>
<script src="/static/js/api-client.js"></script>
<script src="/static/js/app-shell.js"></script>
</body>
</html>
