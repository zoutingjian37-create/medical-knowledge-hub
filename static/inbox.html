<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粘贴链接 - Medical Knowledge Hub</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<main class="page-shell link-capture-page">
    <header class="workspace-header">
        <div><h1>粘贴链接</h1><p>读取公开内容后，先生成可查看的 Markdown；需要时再用 Skill 凝练。确认前不会写入 Obsidian。</p></div>
    </header>
    <section class="capture-panel">
        <div class="capture-panel__body">
        <div class="capture-form">
            <input id="articleUrl" type="url" autocomplete="off" placeholder="粘贴微信 / 知乎 / B站 / 小红书 / 抖音公开链接" aria-label="公开内容链接">
            <button id="parseButton">读取公开链接</button>
        </div>
        <div id="result" class="capture-result" aria-live="polite">
            <h2 id="title"></h2>
            <div id="meta" class="capture-result__meta"></div>
            <p id="preview" class="capture-result__message"></p>
            <div class="capture-actions">
                <button id="basicPreviewButton" class="secondary" hidden>生成基础 Markdown 预览</button>
                <button id="distillButton" hidden>使用 Skill 凝练</button>
                <a id="reviewLink" class="button" href="/review.html" hidden>查看预览并确认保存</a>
            </div>
        </div>
        </div>
        <ol class="capture-path" aria-label="归档流程"><li><strong>读取内容</strong>从公开链接取得正文、字幕或说明。</li><li><strong>选择处理</strong>直接生成 Markdown，或额外使用 Skill 凝练。</li><li><strong>确认归档</strong>预览无误后再保存到 Obsidian。</li></ol>
    </section>
</main>
<script src="/static/js/api-client.js"></script>
<script src="/static/js/app-shell.js"></script>
<script>
(function () {
    "use strict";
    var result = document.getElementById("result");
    var title = document.getElementById("title");
    var meta = document.getElementById("meta");
    var preview = document.getElementById("preview");
    var reviewLink = document.getElementById("reviewLink");
    var basicPreviewButton = document.getElementById("basicPreviewButton");
    var distillButton = document.getElementById("distillButton");
    var parseButton = document.getElementById("parseButton");
    var currentJobId = "";

    parseButton.addEventListener("click", async function () {
        var url = document.getElementById("articleUrl").value.trim();
        if (!url) return;
        parseButton.disabled = true;
        result.className = "capture-result show";
        title.textContent = "正在提取…";
        meta.textContent = "";
        preview.textContent = "";
        preview.className = "capture-result__message";
        reviewLink.hidden = true;
        basicPreviewButton.hidden = true;
        distillButton.hidden = true;
        currentJobId = "";
        try {
            var response = await window.ContentHubAPI.post("/api/ext/platforms/queue", { url: url });
            currentJobId = response.job_id || "";
            reviewLink.href = "/review.html#" + currentJobId;
            reviewLink.hidden = !currentJobId;
            var platformNames = {wechat:"微信", zhihu:"知乎", bilibili:"B站", xiaohongshu:"小红书", douyin:"抖音"};
            title.textContent = response.title || "内容已解析";
            meta.textContent = (platformNames[response.platform] || response.platform) + " · " + (response.author || "未识别作者");
            if (response.reason === "advertisement") {
                title.textContent = "已过滤推广内容";
                meta.textContent = platformNames[response.platform] || response.platform;
                preview.textContent = "这篇内容主要是课程、咨询、学员喜报或其他推广信息，未进入待确认区。";
                reviewLink.hidden = true;
                return;
            }
            if (response.reason === "duplicate") {
                title.textContent = "已处理过这篇内容";
                preview.textContent = response.status === "approved"
                    ? "这篇内容已经保存到 Obsidian，不会重复生成笔记。"
                    : "这篇内容已在待处理或待确认列表中，不会重复创建任务。";
                reviewLink.hidden = response.status !== "preview_ready";
                return;
            }
            if (response.platform === "wechat" && response.status === "preview_ready") {
                title.textContent = "公众号清洗预览已生成";
                preview.textContent = "正文和正文图片已保留，明确广告已移除。请查看后确认保存到 Obsidian。";
                reviewLink.hidden = false;
                return;
            }
            if (["pending", "failed", "handoff_ready"].includes(response.status)) {
                var settings = await window.ContentHubAPI.get("/api/ext/knowledge/settings");
                if (settings.auto_distill) {
                    await distillCurrentJob();
                } else {
                    title.textContent = "内容已读取";
                    preview.textContent = "请选择直接生成基础 Markdown，或使用 Skill 生成凝练版；两种方式都需要你最后确认才会归档。";
                    basicPreviewButton.hidden = false;
                    distillButton.hidden = false;
                    reviewLink.hidden = false;
                    return;
                }
            }
            title.textContent = "预览已生成";
            preview.textContent = "内容还没有保存到 Obsidian。请先查看预览，再确认保存。";
            reviewLink.hidden = false;
        } catch (error) {
            title.textContent = "提取失败";
            preview.textContent = error.message;
            preview.className = "capture-result__message is-error";
            reviewLink.hidden = !currentJobId;
        } finally {
            parseButton.disabled = false;
        }
    });

    async function basicPreviewCurrentJob() {
        if (!currentJobId) return;
        basicPreviewButton.disabled = true;
        distillButton.disabled = true;
        preview.textContent = "正在整理基础 Markdown，不会调用 Codex…";
        try {
            await window.ContentHubAPI.post("/api/ext/knowledge/jobs/" + currentJobId + "/basic-preview", {});
            title.textContent = "基础 Markdown 预览已生成";
            preview.textContent = "已保留已读取的正文与来源。现在可查看预览并确认保存，或在待确认页再使用 Skill 凝练。";
            reviewLink.hidden = false;
        } catch (error) {
            preview.textContent = error.message;
            preview.className = "capture-result__message is-error";
        } finally {
            basicPreviewButton.disabled = false;
            distillButton.disabled = false;
        }
    }

    async function distillCurrentJob() {
        if (!currentJobId) return;
        basicPreviewButton.disabled = true;
        distillButton.disabled = true;
        preview.textContent = "正在使用 Skill 凝练内容，通常需要一至数分钟…";
        try {
            await window.ContentHubAPI.post("/api/ext/knowledge/jobs/" + currentJobId + "/compile", {});
            title.textContent = "凝练预览已生成";
            preview.textContent = "请先查看内容；确认后才会保存到 Obsidian。";
            reviewLink.hidden = false;
        } catch (error) {
            preview.textContent = error.message;
            preview.className = "capture-result__message is-error";
        } finally {
            basicPreviewButton.disabled = false;
            distillButton.disabled = false;
        }
    }

    basicPreviewButton.addEventListener("click", basicPreviewCurrentJob);
    distillButton.addEventListener("click", distillCurrentJob);

}());
</script>
</body>
</html>
