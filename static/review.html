<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查看与保存 - Medical Knowledge Hub</title>
    <link rel="stylesheet" href="/static/css/app.css?v=20260801">
</head>
<body class="subscription-surface">
<main class="page-shell review-page">
    <header class="workspace-header review-header">
        <div>
            <h1>查看与保存</h1>
            <p>公众号文章和文献统一在这里确认。只有准备完成的预览才能保存到 Obsidian。</p>
        </div>
    </header>
    <nav class="review-shortcuts" aria-label="内容入口">
        <button id="refresh" class="secondary">刷新任务</button>
        <button id="skillDefault" class="secondary" aria-pressed="true">文献自动讲解：开启</button>
        <a class="button" href="/inbox.html">粘贴新链接</a>
        <a class="button" href="/wechat-collect.html">查找公众号</a>
        <a class="text-action" href="/trash.html">打开回收站</a>
    </nav>
    <section class="review-command-bar" aria-label="批量操作">
        <div class="review-selection">
            <label class="select-all-control">
                <input id="selectAllJobs" type="checkbox">
                <span>全选</span>
            </label>
            <span id="jobSelectionSummary" class="selection-summary">已选 0 项</span>
        </div>
        <div class="review-bulk-actions">
            <button id="recleanSelected" class="secondary" type="button" disabled>重新清洗公众号</button>
            <button id="previewSelected" class="secondary" type="button" disabled>预览</button>
            <button id="saveSelected" type="button" disabled>保存到 Obsidian</button>
            <button id="deleteSelected" class="danger" type="button" disabled>删除</button>
        </div>
    </section>
    <section id="jobs" class="list" aria-live="polite"></section>
</main>

<dialog id="previewDialog">
    <div class="dialog-head">
        <strong>内容预览</strong>
        <button id="closePreview" class="secondary">关闭</button>
    </div>
    <div id="previewContent" class="dialog-body preview-content"></div>
    <div class="dialog-actions">
        <span id="previewMessage" class="dialog-message">确认前不会改动 Obsidian。</span>
        <button id="savePreview">确认保存到 Obsidian</button>
    </div>
</dialog>

<script src="/static/js/api-client.js"></script>
<script src="/static/js/app-shell.js"></script>
<script>
(function () {
    "use strict";
    var jobsRoot = document.getElementById("jobs");
    var dialog = document.getElementById("previewDialog");
    var previewContent = document.getElementById("previewContent");
    var previewMessage = document.getElementById("previewMessage");
    var savePreview = document.getElementById("savePreview");
    var previewJobIds = [];
    var skillDefault = document.getElementById("skillDefault");
    var autoDistill = true;
    var currentJobs = [];
    var jobsById = new Map();
    var selectedIds = new Set();
    var selectAllJobs = document.getElementById("selectAllJobs");
    var selectionSummary = document.getElementById("jobSelectionSummary");
    var previewSelected = document.getElementById("previewSelected");
    var recleanSelected = document.getElementById("recleanSelected");
    var saveSelected = document.getElementById("saveSelected");
    var deleteSelected = document.getElementById("deleteSelected");
    var labels = {
        pending: "等待处理",
        handoff_ready: "正在处理",
        preview_ready: "等待确认",
        needs_reparse: "需要重新读取",
        approved: "已保存",
        rejected: "旧版已删除",
        trashed: "回收站",
        failed: "处理失败"
    };

    function button(label, className, action) {
        var element = document.createElement("button");
        element.textContent = label;
        if (className) element.className = className;
        element.addEventListener("click", action);
        return element;
    }

    async function post(path) {
        return window.ContentHubAPI.post(path, {});
    }

    function setMessage(card, value) {
        card.querySelector(".message").textContent = value;
    }

    function renderJob(job) {
        var card = document.createElement("article");
        card.className = "card";
        card.dataset.jobId = job.id;
        var selector = document.createElement("label");
        selector.className = "card__selector";
        selector.setAttribute("aria-label", "选择 " + (job.title || "未命名文章"));
        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = job.id;
        checkbox.addEventListener("change", function () {
            if (checkbox.checked) selectedIds.add(job.id);
            else selectedIds.delete(job.id);
            card.classList.toggle("card--selected", checkbox.checked);
            updateSelectionControls();
        });
        selector.append(checkbox);
        var top = document.createElement("div");
        top.className = "card__top";
        var summary = document.createElement("div");
        var heading = document.createElement("h2");
        heading.textContent = job.title || "未命名文章";
        var meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = (job.author || "未识别来源") + (job.published_at ? " · " + job.published_at : "");
        summary.append(heading, meta);
        var status = document.createElement("span");
        status.className = "status";
        status.textContent = labels[job.status] || job.status;
        top.append(summary, status);
        var actions = document.createElement("div");
        actions.className = "actions";

        if (job.status === "needs_reparse") {
            actions.append(button("重新读取", "", async function () {
                try {
                    await window.ContentHubAPI.post(
                        "/api/ext/platforms/queue",
                        { url: job.source_url }
                    );
                    await loadJobs();
                } catch (error) { setMessage(card, error.message); }
            }));
        }
        if (["pending", "failed", "handoff_ready"].includes(job.status)) {
            actions.append(button(job.platform === "wechat" ? "生成清洗预览" : "生成文献讲解", "", async function (event) {
                var control = event.currentTarget;
                control.disabled = true;
                setMessage(card, job.platform === "wechat" ? "正在去除广告并保留正文……" : "正在生成通俗文献讲解，通常需要一至数分钟……");
                try {
                    await post("/api/ext/knowledge/jobs/" + job.id + "/compile");
                    await loadJobs();
                } catch (error) {
                    setMessage(card, error.message);
                    control.disabled = false;
                }
            }));
        }
        if (["pending", "failed"].includes(job.status) && job.platform !== "wechat") {
            actions.append(button("复制任务给 Codex", "secondary", async function () {
                try {
                    var result = await post("/api/ext/knowledge/jobs/" + job.id + "/handoff");
                    await navigator.clipboard.writeText(result.instruction);
                    setMessage(card, "任务说明已复制。请在 Codex 中粘贴并执行，然后回来点击“导入 Codex 结果”。");
                } catch (error) { setMessage(card, error.message); }
            }));
        }
        if (job.status === "handoff_ready") {
            actions.append(button("导入 Codex 结果", "", async function () {
                try {
                    await post("/api/ext/knowledge/jobs/" + job.id + "/import-preview");
                    await loadJobs();
                } catch (error) { setMessage(card, error.message); }
            }));
        }
        var message = document.createElement("div");
        message.className = "message";
        if (job.error) message.textContent = job.error;
        card.append(selector, top);
        if (actions.childElementCount) card.append(actions);
        card.append(message);
        return card;
    }

    function updateSelectionControls() {
        var selectedJobs = Array.from(selectedIds).map(function (id) {
            return jobsById.get(id);
        }).filter(Boolean);
        var total = currentJobs.length;
        var selected = selectedJobs.length;
        var allReady = selected > 0 && selectedJobs.every(function (job) {
            return job.status === "preview_ready";
        });
        var allWechat = selected > 0 && selectedJobs.every(function (job) {
            return job.platform === "wechat";
        });
        selectAllJobs.checked = total > 0 && selected === total;
        selectAllJobs.indeterminate = selected > 0 && selected < total;
        selectAllJobs.disabled = total === 0;
        recleanSelected.disabled = !allWechat;
        previewSelected.disabled = !allReady;
        saveSelected.disabled = !allReady;
        deleteSelected.disabled = selected === 0;
        selectionSummary.textContent = allReady && selected
            ? `已选 ${selected} 项，均可预览和保存`
            : `已选 ${selected} 项`;
    }

    function selectedJobIds() {
        return Array.from(selectedIds);
    }

    function safeHttpUrl(value) {
        try {
            var url = new URL(String(value || "").trim());
            if (url.protocol === "http:" || url.protocol === "https:") return url.href;
        } catch (error) {
            return "";
        }
        return "";
    }

    function appendInlineMarkdown(parent, text) {
        var pattern = /!\[([^\]]*)\]\(([^)\s]+)\)|\[([^\]]+)\]\(([^)\s]+)\)/g;
        var cursor = 0;
        var match;
        while ((match = pattern.exec(text)) !== null) {
            if (match.index > cursor) {
                parent.append(document.createTextNode(text.slice(cursor, match.index)));
            }
            var address = safeHttpUrl(match[2] || match[4]);
            if (match[1] !== undefined) {
                if (address) {
                    var image = document.createElement("img");
                    image.src = address;
                    image.alt = match[1] || "正文图片";
                    image.loading = "lazy";
                    image.referrerPolicy = "no-referrer";
                    parent.append(image);
                } else {
                    parent.append(document.createTextNode(match[0]));
                }
            } else if (address) {
                var link = document.createElement("a");
                link.href = address;
                link.target = "_blank";
                link.rel = "noreferrer";
                link.textContent = match[3];
                parent.append(link);
            } else {
                parent.append(document.createTextNode(match[3]));
            }
            cursor = pattern.lastIndex;
        }
        if (cursor < text.length) {
            parent.append(document.createTextNode(text.slice(cursor)));
        }
    }

    function previewBody(markdown) {
        var withoutFrontmatter = String(markdown || "").replace(
            /^---\r?\n[\s\S]*?\r?\n---\r?\n?/,
            ""
        );
        return withoutFrontmatter
            .replace(/^#\s+[^\r\n]+\r?\n+/, "")
            .replace(
                /^[^\r\n]+\r?\n(?=(?:公众号|原文链接|发布日期)\s*[:：])/,
                ""
            )
            .replace(
                /^(?:(?:公众号|原文链接|发布日期)\s*[:：][^\r\n]*\r?\n?){1,3}\r?\n?/,
                ""
            )
            .replace(/^状态：(?:等待用户确认|已确认)\s*$/gm, "")
            .trim();
    }

    function renderMarkdown(markdown) {
        var root = document.createElement("div");
        root.className = "preview-markdown";
        var currentList = null;
        var currentListType = "";
        previewBody(markdown).split(/\r?\n/).forEach(function (line) {
            var trimmed = line.trim();
            if (!trimmed) {
                currentList = null;
                currentListType = "";
                return;
            }
            var heading = trimmed.match(/^(#{1,6})\s+(.+)$/);
            var unordered = trimmed.match(/^[-*+]\s+(.+)$/);
            var ordered = trimmed.match(/^\d+[.)]\s+(.+)$/);
            var element;
            if (heading) {
                element = document.createElement("h" + Math.min(6, heading[1].length + 1));
                appendInlineMarkdown(element, heading[2]);
            } else if (unordered || ordered) {
                var listType = ordered ? "ol" : "ul";
                if (!currentList || currentListType !== listType) {
                    currentList = document.createElement(listType);
                    currentListType = listType;
                    root.append(currentList);
                }
                element = document.createElement("li");
                appendInlineMarkdown(element, (unordered || ordered)[1]);
                currentList.append(element);
                return;
            } else if (/^>\s?/.test(trimmed)) {
                element = document.createElement("blockquote");
                appendInlineMarkdown(element, trimmed.replace(/^>\s?/, ""));
            } else if (/^(?:---+|___+|\*\*\*+)$/.test(trimmed)) {
                element = document.createElement("hr");
            } else {
                element = document.createElement("p");
                appendInlineMarkdown(element, trimmed);
            }
            currentList = null;
            currentListType = "";
            root.append(element);
        });
        return root;
    }

    function renderPreviewDocument(result, job, index) {
        var article = document.createElement("article");
        article.className = "preview-document";
        var header = document.createElement("header");
        var heading = document.createElement("h2");
        heading.textContent = `${index + 1}. ${job.title || "未命名内容"}`;
        var meta = document.createElement("p");
        meta.className = "preview-meta";
        meta.textContent = [job.author || "未识别来源", job.published_at || "日期未识别"]
            .join(" · ");
        header.append(heading, meta);
        var source = safeHttpUrl(job.source_url);
        if (source) {
            var sourceLink = document.createElement("a");
            sourceLink.href = source;
            sourceLink.target = "_blank";
            sourceLink.rel = "noreferrer";
            sourceLink.textContent = "打开原文";
            header.append(sourceLink);
        }
        article.append(header, renderMarkdown(result.markdown));
        return article;
    }

    async function openSelectedPreviews() {
        var ids = selectedJobIds();
        if (!ids.length) return;
        previewSelected.disabled = true;
        selectionSummary.textContent = "正在读取预览";
        try {
            var results = await Promise.all(ids.map(function (id) {
                return window.ContentHubAPI.get("/api/ext/knowledge/jobs/" + id + "/preview");
            }));
            previewContent.replaceChildren();
            results.forEach(function (result, index) {
                previewContent.append(
                    renderPreviewDocument(result, jobsById.get(ids[index]), index)
                );
            });
            previewJobIds = ids;
            previewMessage.textContent = `正在预览 ${ids.length} 项；确认前不会改动 Obsidian。`;
            savePreview.disabled = false;
            dialog.showModal();
        } catch (error) {
            selectionSummary.textContent = "预览读取失败：" + error.message;
        } finally {
            updateSelectionControls();
        }
    }

    async function approveSelectedJobs(jobIds) {
        if (!jobIds.length || !window.confirm(`确认把选中的 ${jobIds.length} 项保存到 Obsidian？`)) return;
        saveSelected.disabled = true;
        savePreview.disabled = true;
        previewMessage.textContent = `正在保存 ${jobIds.length} 项到 Obsidian……`;
        selectionSummary.textContent = `正在保存 ${jobIds.length} 项`;
        try {
            var result = await window.ContentHubAPI.post(
                "/api/ext/knowledge/jobs/approve-selected",
                { job_ids: jobIds }
            );
            if (dialog.open) dialog.close();
            previewJobIds = [];
            await loadJobs();
            selectionSummary.textContent = `已保存 ${result.count} 项到 Obsidian`;
        } catch (error) {
            previewMessage.textContent = "保存失败：" + error.message;
            selectionSummary.textContent = "保存失败：" + error.message;
            savePreview.disabled = false;
            updateSelectionControls();
        }
    }

    async function loadJobs() {
        jobsRoot.textContent = "正在读取任务……";
        try {
            var data = await window.ContentHubAPI.get("/api/ext/knowledge/jobs");
            jobsRoot.textContent = "";
            selectedIds.clear();
            currentJobs = data.jobs.slice().reverse();
            jobsById = new Map(currentJobs.map(function (job) { return [job.id, job]; }));
            if (!data.jobs.length) {
                var empty = document.createElement("div");
                empty.className = "empty";
                empty.textContent = "还没有待处理内容。";
                jobsRoot.append(empty);
                updateSelectionControls();
                return;
            }
            currentJobs.forEach(function (job) {
                jobsRoot.append(renderJob(job));
            });
            updateSelectionControls();
        } catch (error) {
            jobsRoot.textContent = "任务读取失败：" + error.message;
        }
    }

    document.getElementById("refresh").addEventListener("click", loadJobs);
    selectAllJobs.addEventListener("change", function () {
        selectedIds.clear();
        jobsRoot.querySelectorAll(".card__selector input").forEach(function (control) {
            control.checked = selectAllJobs.checked;
            control.closest(".card").classList.toggle("card--selected", control.checked);
            if (control.checked) selectedIds.add(control.value);
        });
        updateSelectionControls();
    });
    recleanSelected.addEventListener("click", async function () {
        var ids = selectedJobIds();
        if (!ids.length) return;
        recleanSelected.disabled = true;
        selectionSummary.textContent = `正在按最新规则重新清洗 ${ids.length} 项`;
        try {
            var result = await window.ContentHubAPI.post(
                "/api/ext/knowledge/jobs/reclean-selected",
                { job_ids: ids }
            );
            await loadJobs();
            selectionSummary.textContent = result.filtered
                ? `重新清洗完成；${result.filtered} 项广告已移入回收站`
                : `已重新清洗 ${result.count} 项`;
        } catch (error) {
            selectionSummary.textContent = "重新清洗失败：" + error.message;
            updateSelectionControls();
        }
    });
    previewSelected.addEventListener("click", openSelectedPreviews);
    saveSelected.addEventListener("click", function () {
        approveSelectedJobs(selectedJobIds());
    });
    deleteSelected.addEventListener("click", async function () {
        var ids = selectedJobIds();
        if (!ids.length || !window.confirm(`将选中的 ${ids.length} 项移入回收站，是否继续？`)) return;
        deleteSelected.disabled = true;
        selectionSummary.textContent = `正在移动 ${ids.length} 项到回收站`;
        try {
            var result = await window.ContentHubAPI.post(
                "/api/ext/knowledge/jobs/trash-selected",
                { job_ids: ids }
            );
            await loadJobs();
            selectionSummary.textContent = `已将 ${result.count} 项移入回收站`;
        } catch (error) {
            selectionSummary.textContent = "删除失败：" + error.message;
            updateSelectionControls();
        }
    });
    savePreview.addEventListener("click", async function () {
        approveSelectedJobs(previewJobIds);
    });
    skillDefault.addEventListener("click", async function () {
        try {
            var result = await window.ContentHubAPI.put("/api/ext/knowledge/settings", {
                auto_distill: !autoDistill
            });
            setSkillState(result.auto_distill);
        } catch (error) { jobsRoot.textContent = "设置保存失败：" + error.message; }
    });
    function setSkillState(enabled) {
        autoDistill = Boolean(enabled);
        skillDefault.textContent = "文献自动讲解：" + (autoDistill ? "开启" : "关闭");
        skillDefault.setAttribute("aria-pressed", String(autoDistill));
    }
    window.ContentHubAPI.get("/api/ext/knowledge/settings")
        .then(function (result) { setSkillState(result.auto_distill); })
        .catch(function () { setSkillState(true); });
    document.getElementById("closePreview").addEventListener("click", function () {
        dialog.close();
        previewJobIds = [];
        previewContent.replaceChildren();
    });
    loadJobs();
}());
</script>
</body>
</html>
